<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un étudiant - Dashboard IUT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin">Pointage IUT</a>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white fw-bold">
                Modifier l'étudiant : {{ etudiant.prenom }} {{ etudiant.nom }}
            </div>
            <div class="card-body">
                <form action="/admin/etudiants/{{ etudiant.id }}/modifier" method="post">
                    <div class="mb-3">
                        <label for="numero_etudiant" class="form-label fw-bold">Numéro étudiant :</label>
                        <input type="text" id="numero_etudiant" name="numero_etudiant" value="{{ etudiant.numero_etudiant }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="nom" class="form-label fw-bold">Nom :</label>
                        <input type="text" id="nom" name="nom" value="{{ etudiant.nom }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="prenom" class="form-label fw-bold">Prénom :</label>
                        <input type="text" id="prenom" name="prenom" value="{{ etudiant.prenom }}" class="form-control" required>
                    </div>

                    <!-- Champ Badge NFC -->
                    <div class="mb-3">
                        <label for="nfc_uid" class="form-label fw-bold">UID du Badge NFC :</label>
                        <input type="text" id="nfc_uid" name="nfc_uid" value="{% if etudiant.carte %}{{ etudiant.carte.nfc_uid }}{% endif %}" class="form-control" placeholder="Ex: 04A2B3C4 ou laisse vide">
                        <div class="form-text">Scanne la carte ou saisis l'UID manuellement.</div>
                    </div>

                    <!-- Sélection multiple des groupes -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Groupes de l'étudiant :</label>
                        <div class="border p-3 rounded bg-white" style="max-height: 200px; overflow-y: auto;">
                            {% for g in groupes %}
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="groupes_ids" value="{{ g.id }}" id="groupe_{{ g.id }}"
                                        {% if g in etudiant.groupes %}checked{% endif %}>
                                    <label class="form-check-label" for="groupe_{{ g.id }}">
                                        {{ g.nom_groupe }}
                                    </label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/admin" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-dark">Enregistrer les modifications</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
